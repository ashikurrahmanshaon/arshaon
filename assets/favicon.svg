<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background rounded hexagon/squircle -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="#090d16" stroke="url(#grad)" stroke-width="3" />
  <!-- Monogram 'AR' stylized -->
  <path d="M 28 68 L 44 26 C 45 23, 49 23, 50 26 L 66 68" fill="none" stroke="url(#grad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 35 53 L 59 53" fill="none" stroke="url(#grad)" stroke-width="5" stroke-linecap="round" />
  <!-- Accent terminal dot -->
  <circle cx="68" cy="65" r="4.5" fill="#06b6d4" filter="url(#glow)" />
</svg>
