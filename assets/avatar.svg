<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="neonAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f6d5b8" />
      <stop offset="100%" stop-color="#e0ac80" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="avatarGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Aura Circle -->
  <circle cx="200" cy="200" r="185" fill="url(#bgGrad)" stroke="url(#neonAccent)" stroke-width="3.5" />
  
  <!-- Subtle decorative tech grid dots -->
  <g opacity="0.15" fill="#38bdf8">
    <circle cx="60" cy="80" r="2.5" /><circle cx="80" cy="80" r="2.5" /><circle cx="100" cy="80" r="2.5" />
    <circle cx="60" cy="100" r="2.5" /><circle cx="80" cy="100" r="2.5" /><circle cx="100" cy="100" r="2.5" />
    <circle cx="300" cy="280" r="2.5" /><circle cx="320" cy="280" r="2.5" /><circle cx="340" cy="280" r="2.5" />
    <circle cx="300" cy="300" r="2.5" /><circle cx="320" cy="300" r="2.5" /><circle cx="340" cy="300" r="2.5" />
  </g>

  <!-- Ambient Glow Behind Character -->
  <circle cx="200" cy="190" r="120" fill="#6366f1" opacity="0.18" filter="url(#avatarGlow)" />

  <!-- Body / Hoodie -->
  <path d="M 110 370 C 110 295, 140 265, 200 265 C 260 265, 290 295, 290 370 Z" fill="#182234" />
  <!-- Hoodie inner shadow & zipper/neon line -->
  <path d="M 160 270 L 200 310 L 240 270" fill="none" stroke="#2a3b56" stroke-width="4" />
  <line x1="200" y1="310" x2="200" y2="370" stroke="url(#neonAccent)" stroke-width="3" stroke-linecap="round" />

  <!-- Neck -->
  <path d="M 175 235 L 175 275 C 185 285, 215 285, 225 275 L 225 235 Z" fill="#d89b6f" />

  <!-- Head / Face -->
  <ellipse cx="200" cy="195" rx="55" ry="65" fill="url(#skinGrad)" />

  <!-- Ears -->
  <ellipse cx="143" cy="195" rx="9" ry="14" fill="#e0ac80" />
  <ellipse cx="257" cy="195" rx="9" ry="14" fill="#e0ac80" />

  <!-- Modern Hair -->
  <path d="M 142 185 C 138 145, 155 120, 200 118 C 248 118, 262 145, 258 185 C 250 152, 235 138, 200 138 C 165 138, 148 155, 142 185 Z" fill="url(#hairGrad)" />
  <!-- Hair volume top spikes/waves -->
  <path d="M 152 135 C 160 110, 185 105, 205 108 C 230 111, 250 120, 254 135 C 240 122, 220 118, 200 120 C 180 122, 162 128, 152 135 Z" fill="#293548" />

  <!-- Stylish Glasses (Modern Developer Aesthetic) -->
  <rect x="156" y="180" width="36" height="24" rx="8" fill="#0f172a" stroke="url(#neonAccent)" stroke-width="2.5" />
  <rect x="208" y="180" width="36" height="24" rx="8" fill="#0f172a" stroke="url(#neonAccent)" stroke-width="2.5" />
  <line x1="192" y1="192" x2="208" y2="192" stroke="url(#neonAccent)" stroke-width="2.5" />
  <!-- Glasses lens reflection -->
  <line x1="162" y1="184" x2="175" y2="184" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" opacity="0.8" />
  <line x1="214" y1="184" x2="227" y2="184" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" opacity="0.8" />

  <!-- Eyes behind glasses -->
  <circle cx="174" cy="192" r="3.5" fill="#f8fafc" />
  <circle cx="226" cy="192" r="3.5" fill="#f8fafc" />

  <!-- Eyebrows -->
  <path d="M 160 172 Q 174 167 186 172" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />
  <path d="M 214 172 Q 226 167 240 172" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />

  <!-- Nose -->
  <path d="M 197 197 Q 200 212 205 212" fill="none" stroke="#c48a5c" stroke-width="2.5" stroke-linecap="round" />

  <!-- Confident friendly smile -->
  <path d="M 186 226 Q 200 237 214 226" fill="none" stroke="#b36c46" stroke-width="2.8" stroke-linecap="round" />

  <!-- Floating Badges around avatar -->
  <!-- Left Badge -->
  <g transform="translate(55, 170)">
    <rect width="64" height="34" rx="10" fill="#0b1329" stroke="#6366f1" stroke-width="1.5" opacity="0.95" />
    <text x="32" y="22" fill="#818cf8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Creative</text>
  </g>
  <!-- Right Badge -->
  <g transform="translate(280, 160)">
    <rect width="68" height="34" rx="10" fill="#0b1329" stroke="#06b6d4" stroke-width="1.5" opacity="0.95" />
    <text x="34" y="22" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Driven</text>
  </g>
  <!-- Bottom Status Pill -->
  <g transform="translate(130, 345)">
    <rect width="140" height="32" rx="16" fill="#090d16" stroke="#10b981" stroke-width="1.5" />
    <circle cx="146" cy="16" r="4.5" fill="#10b981" filter="url(#avatarGlow)" />
    <text x="75" y="21" fill="#ecfdf5" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">Available</text>
  </g>
</svg>
